# dsh-compat — L3 客户端垫片（host + client 半区）
#
# 本文件是 `dsh.bundle.patch` 层（package.json `dsh.bundle.patch` 指向这里）：
# `dsh plugin --profile <名> add dsh-compat` 看到这份声明后，把 dsh-compat
# 追加进 profile 的 bundle 栈，loader 按本行的 insert 挂载插件。
#
# 本包同时有 host 半区（lib/index.js）与 client 半区（lib/client.js）：
# `dsh.client` 与 `exports["./client"]` 必须成对声明——只有前者会在宿主服务端
# 组合期抛 ClientPackageCompositionError（spike 实证，2026-10-28）。

- insert:
    - id: dsh-compat
      name: dsh-compat
